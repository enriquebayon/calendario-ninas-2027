<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Calendario de las niñas · 2027</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--text:#1f2328;--muted:#777;
  --enrique:#f5a23a;--maria:#ef86b7;--holiday:#246bfd;--line:#eceae4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:14px 10px 36px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
h1{font-size:24px;line-height:1.05;margin:0;font-weight:850;letter-spacing:-.5px}
.subtitle{font-size:12px;color:var(--muted);margin-top:5px}
.toggle{display:flex;background:#e9e7e1;border-radius:13px;padding:3px}
.toggle button{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:750;color:#666}
.toggle button.active{background:#fff;color:#111;box-shadow:0 1px 5px #0001}
.controls{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:8px 9px;margin-bottom:9px;box-shadow:0 2px 12px #00000008}
.nav{width:42px;height:40px;border:0;border-radius:11px;background:#f3f2ee;font-size:24px}
.month-title{font-size:17px;font-weight:850;text-transform:capitalize}
.card{background:#fff;border-radius:18px;padding:9px 7px 10px;box-shadow:0 2px 12px #00000008}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.weekdays div{min-width:0;text-align:center;font-size:10px;font-weight:850;color:#8b8b8b;padding:7px 0}
.day{min-width:0;min-height:67px;border-radius:11px;padding:7px 5px;display:flex;flex-direction:column;justify-content:space-between;position:relative;border:2px solid transparent}
.day.empty{background:transparent}
.day.enrique{background:var(--enrique)}
.day.maria{background:var(--maria)}
.day.today{border-color:#111}
.num{font-size:17px;font-weight:900;width:31px;height:31px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day.holiday .num{background:#fff;border:3px solid var(--holiday);color:#111}
.holiday-name{font-size:8px;line-height:1.05;font-weight:850;color:#1547aa;background:#eef4ff;border-radius:5px;padding:3px 3px;width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.owner{font-size:9px;font-weight:850;opacity:.72}
.legend{display:flex;gap:13px;flex-wrap:wrap;padding:2px 4px 0;font-size:11px;color:#555}
.leg{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px}
.ring{width:16px;height:16px;border-radius:50%;border:3px solid var(--holiday);background:#fff}
.note{font-size:10px;color:#888;text-align:left;margin:6px 4px 10px}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mini{background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 10px #00000008}
.mini-title{text-align:center;text-transform:capitalize;font-size:12px;font-weight:850;margin-bottom:6px}
.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mwd{font-size:7px;text-align:center;font-weight:800;color:#aaa}
.md{min-width:0;aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:750}
.md.enrique{background:var(--enrique)} .md.maria{background:var(--maria)}
.md.holiday{border:2px solid var(--holiday);border-radius:50%}

.day.current-week{
  box-shadow:0 0 0 3px #111 inset;
}
.day.change-day{
  background:#f7df62 !important;
  color:#111;
}
.change-label{
  font-size:8px;line-height:1.05;font-weight:900;color:#4a3a00;
  background:#fff6bf;border-radius:5px;padding:3px 4px;
  width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:normal;text-align:center;
}
.md.current-week{
  box-shadow:0 0 0 2px #111 inset;
}
.md.change-day{
  background:#f7df62 !important;
  color:#111;
}
.mini-note{
  margin-top:5px;
  font-size:8px;
  line-height:1.15;
  color:#6a5a00;
  font-weight:800;
  text-align:center;
  background:#fff6bf;
  border-radius:6px;
  padding:3px 4px;
}

.hidden{display:none!important}
@media(max-width:620px){
  .app{max-width:none;width:100%;padding:10px 6px calc(28px + env(safe-area-inset-bottom));padding-top:calc(10px + env(safe-area-inset-top));overflow-x:hidden}
  h1{font-size:21px} .header{margin-bottom:10px}
  .toggle button{padding:7px 10px;font-size:12px}
  .card{padding:8px 4px 9px;border-radius:16px}
  .weekdays,.days{gap:3px}
  .day{min-width:0;min-height:61px;padding:5px 3px;border-radius:8px}
  .num{font-size:16px;width:27px;height:27px}
  .owner{display:none}
  .holiday-name{font-size:6px;line-height:1.05;padding:2px 1px;white-space:normal}
  .change-label{font-size:6px;line-height:1.05;padding:2px 1px;white-space:normal;text-align:center}
  .year-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .mini{min-width:0;padding:6px}
}
@media(max-width:360px){
  .app{padding-left:4px;padding-right:4px}
  .card{padding-left:3px;padding-right:3px}
  .weekdays,.days{gap:2px}
  .day{min-height:58px;padding:4px 2px;border-radius:7px}
  .num{font-size:15px;width:25px;height:25px}
  .holiday-name,.change-label{font-size:5.5px;padding:2px 1px}
}
</style>
</head>

    <div><h1>Calendario niñas 2027</h1></div>
    <div class="toggle"><button id="bMonth">Mes</button><button id="bYear" class="active">Año</button></div>

function monday(d){const x=new Date(d);const n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}

function isCurrentWeekDate(y,m,d){

  end.setDate(start.getDate()+6);
  end.setHours(23,59,59,999);
  return target>=start && target<=end;
}

function renderYear(){
  const root=document.getElementById("yearGrid");root.innerHTML="";
  for(let m=0;m<12;m++){
    const box=document.createElement("div");box.className="mini";
    const t=document.createElement("div");t.className="mini-title";t.textContent=months[m];box.appendChild(t);
    const g=document.createElement("div");g.className="mini-grid";
    ["L","M","X","J","V","S","D"].forEach(x=>{const w=document.createElement("div");w.className="mwd";w.textContent=x;g.appendChild(w)});
    const first=new Date(YEAR,m,1),off=(first.getDay()+6)%7,cnt=new Date(YEAR,m+1,0).getDate();
    for(let i=0;i<off;i++)g.appendChild(document.createElement("div"));
    for(let d=1;d<=cnt;d++){const k=key(m,d),x=document.createElement("div");x.className=`md ${schedule[k]||""}${holidays[k]?" holiday":""}${changeDays[k]?" change-day":""}${isCurrentWeekDate(YEAR,m,d)?" current-week":""}`;x.textContent=d;g.appendChild(x)}
    box.appendChild(g);if(m===2){const n=document.createElement("div");n.className="mini-note";n.textContent="25 · Cambio a medio día";box.appendChild(n)}box.onclick=()=>{currentMonth=m;showMonth()};root.appendChild(box)
  }
}

function showMonth(){document.getElementById("monthView").classList.remove("hidden");document.getElementById("yearView").classList.add("hidden");document.getElementById("bMonth").classList.add("active");document.getElementById("bYear").classList.remove("active");renderMonth()}
function showYear(){document.getElementById("monthView").classList.add("hidden");document.getElementById("yearView").classList.remove("hidden");document.getElementById("bMonth").classList.remove("active");document.getElementById("bYear").classList.add("active");renderYear()}

document.getElementById("prev").onclick=()=>{currentMonth=(currentMonth+11)%12;renderMonth()};
document.getElementById("next").onclick=()=>{currentMonth=(currentMonth+1)%12;renderMonth()};
document.getElementById("bMonth").onclick=()=>{currentMonth=now.getMonth();showMonth()};
document.getElementById("bYear").onclick=showYear;
renderYear();
</script>
</body>
</html>
