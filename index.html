<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Calendario niñas 2027</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f6f5f1; --card:#fff; --text:#202124; --muted:#747474;
  --enrique:#f5a23a; --maria:#ef86b7; --blue:#246bfd; --yellow:#f7df62;
  --line:#e9e7e1; --danger:#b3261e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:12px 10px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h1{font-size:23px;line-height:1.05;margin:0;font-weight:850;letter-spacing:-.4px}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:800;background:#ebe9e3;color:#222;cursor:pointer}
.btn.primary{background:#111;color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.danger{background:#fde7e5;color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#d92727;color:#fff;font-size:11px;font-weight:900}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:#555;margin:4px 2px 10px}
.leg{display:flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:4px}
.ring{width:15px;height:15px;border:3px solid var(--blue);border-radius:50%}
.toolbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:7px;margin-bottom:9px}
.toggle{display:flex;background:#eceae5;border-radius:10px;padding:2px}
.toggle button{border:0;background:transparent;border-radius:8px;padding:7px 10px;font-weight:800}
.toggle button.active{background:#fff}
.month-nav{display:flex;align-items:center;gap:8px}
.nav{border:0;width:38px;height:38px;border-radius:10px;background:#f1f0ec;font-size:21px}
.month-title{font-weight:850;min-width:120px;text-align:center;text-transform:capitalize}
.selectionbar{display:none;position:sticky;top:6px;z-index:5;background:#111;color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:9px;align-items:center;justify-content:space-between;gap:8px}
.selectionbar.show{display:flex}
.selectionbar strong{font-size:14px}
.card{background:#fff;border-radius:17px;padding:8px 6px 10px}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekdays div{text-align:center;font-size:9px;font-weight:850;color:#8a8a8a;padding:5px 0}
.day{appearance:none;border:2px solid transparent;min-width:0;min-height:66px;border-radius:10px;padding:6px 4px;position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#111;text-align:left}
.day.enrique{background:var(--enrique)} .day.maria{background:var(--maria)} .day.empty{background:transparent}
.day.current-week{box-shadow:0 0 0 2px #111 inset}
.day.selected{border-color:var(--blue);box-shadow:0 0 0 2px #fff inset}
.day.change-day{background:var(--yellow)!important}
.num{font-size:16px;font-weight:900;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.day.holiday .num{background:#fff;border:3px solid var(--blue)}
.smalllabel{font-size:7px;font-weight:900;line-height:1.05;white-space:normal;overflow-wrap:anywhere;background:#ffffffdd;border-radius:4px;padding:2px 3px;max-width:100%}
.selectmark{position:absolute;right:4px;top:4px;background:var(--blue);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:#fff;border-radius:13px;padding:7px;cursor:pointer}
.mini-title{text-align:center;font-size:12px;font-weight:850;text-transform:capitalize;margin-bottom:5px}
.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mwd{font-size:7px;text-align:center;color:#aaa;font-weight:800}
.md{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;border-radius:3px;min-width:0}
.md.enrique{background:var(--enrique)} .md.maria{background:var(--maria)} .md.current-week{box-shadow:0 0 0 2px #111 inset}
.md.holiday{border:2px solid var(--blue);border-radius:50%} .md.change-day{background:var(--yellow)!important}
.panel{background:#fff;border-radius:16px;padding:14px;margin:10px 0}
.panel h2{font-size:17px;margin:0 0 10px}
.proposal{border-top:1px solid var(--line);padding:11px 0}
.proposal:first-of-type{border-top:0}
.proposal-title{font-weight:850;font-size:14px}
.muted{color:var(--muted);font-size:12px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.chip{background:#f0efeb;border-radius:8px;padding:5px 7px;font-size:11px;font-weight:750}
.modalback{display:none;position:fixed;inset:0;background:#0006;z-index:20;padding:18px;align-items:flex-end;justify-content:center}
.modalback.show{display:flex}
.modal{background:#fff;width:min(520px,100%);max-height:85vh;overflow:auto;border-radius:20px;padding:16px}
.modal h2{margin:0 0 10px;font-size:19px}
.userchoice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.userchoice button{border:2px solid transparent;border-radius:14px;padding:14px 10px;font-weight:850;font-size:16px}
.userchoice button.enrique{background:var(--enrique)} .userchoice button.maria{background:var(--maria)}
.userchoice button.active{border-color:#111}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field input{font-size:16px;padding:12px;border:1px solid #ccc;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.hidden{display:none!important}
@media(max-width:620px){
  .app{padding:9px 7px 28px}
  h1{font-size:19px}
  .year-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .day{min-height:58px;padding:5px 3px}
  .weekdays,.days{gap:3px}
  .toolbar{padding:5px}
  .btn{padding:8px 9px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Calendario niñas 2027</h1>
  <div class="actions">
    <button id="pendingBtn" class="btn hidden">Pendientes <span id="pendingCount" class="badge">0</span></button>
    <button id="loginBtn" class="btn">Editar</button>
    <button id="logoutBtn" class="btn hidden">Salir</button>
  </div>
</header>

<div class="legend">
  <span class="leg"><span class="sw" style="background:var(--enrique)"></span>Enrique</span>
  <span class="leg"><span class="sw" style="background:var(--maria)"></span>María</span>
  <span class="leg"><span class="ring"></span>Festivo</span>
  <span class="leg"><span class="sw" style="background:var(--yellow)"></span>Cambio a medio día</span>
  <span class="leg"><span class="sw" style="background:white;border:2px solid #111"></span>Semana actual</span>
</div>

<div class="toolbar">
  <div class="toggle"><button id="yearBtn" class="active">Año</button><button id="monthBtn">Mes</button></div>
  <div id="monthNav" class="month-nav hidden">
    <button id="prev" class="nav">‹</button>
    <div id="monthTitle" class="month-title"></div>
    <button id="next" class="nav">›</button>
  </div>
</div>

<div id="selectionBar" class="selectionbar">
  <strong><span id="selectedCount">0</span> días seleccionados</strong>
  <div class="actions">
    <button id="clearSel" class="btn">Cancelar</button>
    <button id="reviewSel" class="btn blue">Revisar</button>
  </div>
</div>

<section id="yearView"><div id="yearGrid" class="year-grid"></div></section>
<section id="monthView" class="hidden">
  <div class="card">
    <div class="weekdays"><div>LU</div><div>MA</div><div>MI</div><div>JU</div><div>VI</div><div>SÁ</div><div>DO</div></div>
    <div id="days" class="days"></div>
  </div>
</section>

</div>

<div id="proposalsModal" class="modalback">
  <div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px">
      <h2 style="margin:0">Propuestas</h2>
      <button id="closeProposals" class="btn">Cerrar</button>
    </div>
    <div id="proposalsList"></div>
  </div>
</div>

<div id="loginModal" class="modalback">
  <div class="modal">
    <h2>Acceso para editar</h2>
    <div class="userchoice">
      <button id="chooseEnrique" class="enrique">Enrique</button>
      <button id="chooseMaria" class="maria">María</button>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input id="passInput" type="password" autocomplete="current-password">
    </div>
    <div id="loginError" class="muted"></div>
    <div class="row">
      <button id="closeLogin" class="btn">Cancelar</button>
      <button id="doLogin" class="btn primary">Entrar</button>
    </div>
  </div>
</div>

<div id="reviewModal" class="modalback">
  <div class="modal">
    <h2>Revisar propuesta</h2>
    <div id="reviewList" class="chips"></div>
    <p class="muted">Se enviará como una única propuesta. La otra persona deberá aceptar o rechazar todos los días juntos.</p>
    <div class="row">
      <button id="closeReview" class="btn">Volver</button>
      <button id="sendProposal" class="btn blue">Enviar propuesta</button>
    </div>
  </div>
</div>

function other(owner){return owner==="enrique"?"maria":"enrique"}
function displayOwner(o){return o==="enrique"?"Enrique":"María"}
function currentUserName(){if(!session)return "";return session.user.email?.startsWith("enrique")?"Enrique":"María"}
function openModal(id,on){document.getElementById(id).classList.toggle("show",on)}

async function loadCalendar(){
  const {data,error}=await sb.from("calendar_days").select("day,owner").gte("day","2027-01-01").lte("day","2027-12-31");
  if(!error&&data?.length){calendar={};data.forEach(r=>calendar[r.day]=r.owner)}
  render();
}

async function loadSession(){
  const {data}=await sb.auth.getSession();
  session=data.session;
  updateAuthUI();
  if(session)await loadProposals();
}

function updateAuthUI(){
  document.getElementById("loginBtn").classList.toggle("hidden",!!session);
  document.getElementById("logoutBtn").classList.toggle("hidden",!session);
  document.getElementById("pendingBtn").classList.toggle("hidden",!session);
  if(session)document.getElementById("logoutBtn").textContent=`Salir · ${currentUserName()}`;
  if(!session){
    selected.clear();
    openModal("proposalsModal",false);
  }
  updateSelectionBar();
}

function updateSelectionBar(){
  document.getElementById("selectedCount").textContent=selected.size;
  document.getElementById("selectionBar").classList.toggle("show",!!session&&selected.size>0);
}

function toggleDay(s){
  if(!session){openModal("loginModal",true);return}
  if(selected.has(s))selected.delete(s); else selected.add(s);
  updateSelectionBar();
  renderMonth();
}

function renderMonth(){
  document.getElementById("monthTitle").textContent=`${months[currentMonth]} 2027`;
  const root=document.getElementById("days"); root.innerHTML="";
  const first=new Date(YEAR,currentMonth,1), off=(first.getDay()+6)%7, count=new Date(YEAR,currentMonth+1,0).getDate();
  for(let i=0;i<off;i++){const e=document.createElement("div");e.className="day empty";root.appendChild(e)}
  for(let d=1;d<=count;d++){
    const s=key(currentMonth,d), owner=calendar[s], hol=holidays[s], change=changeDays[s];
    const e=document.createElement("button");
    e.type="button";
    e.className=`day ${owner||""}${hol?" holiday":""}${change?" change-day":""}${isCurrentWeek(s)?" current-week":""}${selected.has(s)?" selected":""}`;
    const n=document.createElement("span");n.className="num";n.textContent=d;e.appendChild(n);
    if(selected.has(s)){const mk=document.createElement("span");mk.className="selectmark";mk.textContent="✓";e.appendChild(mk)}
    const lab=document.createElement("span");lab.className="smalllabel";lab.textContent=change||hol||displayOwner(owner);e.appendChild(lab);
    e.addEventListener("click",()=>toggleDay(s));
    root.appendChild(e)
  }
}

function renderYear(){
  const root=document.getElementById("yearGrid"); root.innerHTML="";
  for(let m=0;m<12;m++){
    const box=document.createElement("div");box.className="mini";
    const t=document.createElement("div");t.className="mini-title";t.textContent=months[m];box.appendChild(t);
    const g=document.createElement("div");g.className="mini-grid";
    ["L","M","X","J","V","S","D"].forEach(v=>{const x=document.createElement("div");x.className="mwd";x.textContent=v;g.appendChild(x)});
    const first=new Date(YEAR,m,1),off=(first.getDay()+6)%7,cnt=new Date(YEAR,m+1,0).getDate();
    for(let i=0;i<off;i++)g.appendChild(document.createElement("div"));
    for(let d=1;d<=cnt;d++){
      const s=key(m,d),x=document.createElement("div");
      x.className=`md ${calendar[s]||""}${holidays[s]?" holiday":""}${changeDays[s]?" change-day":""}${isCurrentWeek(s)?" current-week":""}`;
      x.textContent=d;g.appendChild(x)
    }
    box.appendChild(g);
    box.addEventListener("click",()=>{currentMonth=m;showMonth(false)});
    root.appendChild(box)
  }
}

function render(){renderYear();renderMonth()}

function showYear(){
  document.getElementById("yearView").classList.remove("hidden");
  document.getElementById("monthView").classList.add("hidden");
  document.getElementById("monthNav").classList.add("hidden");
  document.getElementById("yearBtn").classList.add("active");
  document.getElementById("monthBtn").classList.remove("active");
  renderYear()
}

function showMonth(goCurrent=true){
  if(goCurrent)currentMonth=new Date().getMonth();
  document.getElementById("yearView").classList.add("hidden");
  document.getElementById("monthView").classList.remove("hidden");
  document.getElementById("monthNav").classList.remove("hidden");
  document.getElementById("yearBtn").classList.remove("active");
  document.getElementById("monthBtn").classList.add("active");
  renderMonth()
}

async function loadProposals(){
  if(!session)return;
  const {data,error}=await sb.from("change_proposals")
    .select("id,created_by,status,created_at,reviewed_at,change_proposal_days(day,from_owner,to_owner)")
    .order("created_at",{ascending:false}).limit(30);
  if(error)return;
  proposals=data||[];
  const incoming=proposals.filter(p=>p.status==="pending"&&p.created_by!==session.user.id);
  document.getElementById("pendingCount").textContent=incoming.length;
  renderProposals()
}

function renderProposals(){
  const root=document.getElementById("proposalsList");root.innerHTML="";
  if(!proposals.length){root.innerHTML='<div class="muted">No hay propuestas todavía.</div>';return}
  proposals.forEach(p=>{
    const wrap=document.createElement("div");wrap.className="proposal";
    const mine=p.created_by===session.user.id;
    const title=document.createElement("div");title.className="proposal-title";
    const status=p.status==="pending"?"Pendiente":p.status==="accepted"?"Aceptada":p.status==="rejected"?"Rechazada":"Cancelada";
    title.textContent=`${mine?"Tu propuesta":"Propuesta recibida"} · ${status}`;
    wrap.appendChild(title);

    const chips=document.createElement("div");chips.className="chips";
    (p.change_proposal_days||[]).sort((a,b)=>a.day.localeCompare(b.day)).forEach(d=>{
      const c=document.createElement("span");c.className="chip";
      c.textContent=`${pretty(d.day)} · ${displayOwner(d.from_owner)} → ${displayOwner(d.to_owner)}`;
      chips.appendChild(c)
    });
    wrap.appendChild(chips);

    if(p.status==="pending"){
      const row=document.createElement("div");row.className="row";
      if(mine){
        const b=document.createElement("button");b.className="btn danger";b.textContent="Cancelar propuesta";
        b.onclick=()=>cancelProposal(p.id);row.appendChild(b)
      } else {
        const a=document.createElement("button");a.className="btn blue";a.textContent="Aceptar todo";
        a.onclick=()=>reviewProposal(p.id,"accepted");
        const r=document.createElement("button");r.className="btn danger";r.textContent="Rechazar";
        r.onclick=()=>reviewProposal(p.id,"rejected");
        row.append(a,r)
      }
      wrap.appendChild(row)
    }
    root.appendChild(wrap)
  })
}

async function sendProposal(){
  if(!session||!selected.size)return;
  const days=[...selected].sort().map(day=>({day,to_owner:other(calendar[day])}));
  document.getElementById("sendProposal").disabled=true;
  const {error}=await sb.rpc("create_change_proposal",{p_days:days});
  document.getElementById("sendProposal").disabled=false;
  if(error){alert(error.message);return}
  selected.clear();
  openModal("reviewModal",false);
  updateSelectionBar();
  renderMonth();
  await loadProposals();
  openModal("proposalsModal",true)
}

async function reviewProposal(id,decision){
  const {error}=await sb.rpc("review_change_proposal",{p_proposal_id:id,p_decision:decision});
  if(error){alert(error.message);return}
  await loadCalendar();
  await loadProposals();
  openModal("proposalsModal",false);
}

async function cancelProposal(id){
  const {error}=await sb.rpc("cancel_change_proposal",{p_proposal_id:id});
  if(error){alert(error.message);return}
  await loadProposals();
  openModal("proposalsModal",false);
}

document.getElementById("yearBtn").onclick=showYear;
document.getElementById("monthBtn").onclick=()=>showMonth(true);
document.getElementById("prev").onclick=()=>{currentMonth=(currentMonth+11)%12;renderMonth()};
document.getElementById("next").onclick=()=>{currentMonth=(currentMonth+1)%12;renderMonth()};
document.getElementById("clearSel").onclick=()=>{selected.clear();updateSelectionBar();renderMonth()};

document.getElementById("reviewSel").onclick=()=>{
  const root=document.getElementById("reviewList");root.innerHTML="";
  [...selected].sort().forEach(s=>{
    const c=document.createElement("span");c.className="chip";
    c.textContent=`${pretty(s)} · ${displayOwner(calendar[s])} → ${displayOwner(other(calendar[s]))}`;
    root.appendChild(c)
  });
  openModal("reviewModal",true)
};

document.getElementById("closeReview").onclick=()=>openModal("reviewModal",false);
document.getElementById("sendProposal").onclick=sendProposal;
document.getElementById("loginBtn").onclick=()=>openModal("loginModal",true);
document.getElementById("closeLogin").onclick=()=>openModal("loginModal",false);

document.getElementById("chooseEnrique").onclick=()=>{
  selectedUser="enrique";
  document.getElementById("chooseEnrique").classList.add("active");
  document.getElementById("chooseMaria").classList.remove("active");
};
document.getElementById("chooseMaria").onclick=()=>{
  selectedUser="maria";
  document.getElementById("chooseMaria").classList.add("active");
  document.getElementById("chooseEnrique").classList.remove("active");
};

document.getElementById("doLogin").onclick=async()=>{
  if(!selectedUser){document.getElementById("loginError").textContent="Selecciona Enrique o María.";return}
  const password=document.getElementById("passInput").value;
  const email=selectedUser==="enrique"?"enrique@calendario.local":"maria@calendario.local";
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById("loginError").textContent="No se ha podido entrar. Revisa la contraseña.";return}
  session=data.session;
  document.getElementById("passInput").value="";
  document.getElementById("loginError").textContent="";
  openModal("loginModal",false);
  updateAuthUI();
  await loadProposals()
};

document.getElementById("logoutBtn").onclick=async()=>{
  await sb.auth.signOut();
  session=null;selectedUser=null;
  updateAuthUI();showYear()
};

document.getElementById("pendingBtn").onclick=async()=>{
  await loadProposals();
  openModal("proposalsModal",true);
};

document.getElementById("closeProposals").onclick=()=>openModal("proposalsModal",false);

render();
showYear();
loadCalendar();
loadSession();
</script>
</body>
</html>
